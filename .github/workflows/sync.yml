name: Fetch and Sync SRS Files to Main

on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * *"

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Download external files
        run: |
          FILES=(
            "adguard.srs https://raw.githubusercontent.com/jinndi/adguard-filter-list-srs/main/adguard-filter-list.srs"
            "cheburnet.srs https://raw.githubusercontent.com/jinndi/geosite-cheburnet/main/geosite-cheburnet.srs"
            "filter.srs https://raw.githubusercontent.com/jinndi/fakeip-filter-srs/main/fakeip-filter.srs"
            "proxy.srs https://raw.githubusercontent.com/jinndi/geosite-blocked/main/geosite-blocked.srs"
            "ruip.srs https://raw.githubusercontent.com/jinndi/geoip-ru/main/ru-no-blocked.srs"
            "ru.srs https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-ru.srs"
            "ipdetect.srs https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-ip-geo-detect.srs"
            "private.srs https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/private.srs"
            "trackers.srs https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-public-tracker.srs"
            "games.srs https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-games.srs"
            "ai.srs https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-ai-chat-!cn.srs"
            "telegramip.srs https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geoip/telegram.srs"
          )

          for item in "${FILES[@]}"; do
            # Разбиваем строку по пробелу на имя файла и URL
            out="${item%% *}"
            url="${item#* }"
            
            echo "Downloading $out from $url..."
            
            # Скачиваем с повторами и проверкой HTTP-ошибок
            curl -fL --retry 3 --retry-delay 5 -o "$out" "$url"
            
            # Проверка, что файл не превратился в HTML-страницу с ошибкой
            if head -c 5 "$out" | grep -q "<html"; then
              echo "Ошибка: Получен HTML вместо файла для $out"
              exit 1
            fi
          done

      - name: Create ruleset archive
        run: |
          # Создаем временную папку и переносим туда файлы
          mkdir -p ruleset
          cp *.srs ruleset/
          
          # Упаковываем всю папку ruleset целиком
          tar -czf ruleset.tar.gz ruleset/
          
          # Очищаем за собой временную папку
          rm -rf ruleset
          echo "Архив ruleset.tar.gz успешно создан."

      - name: Commit and Push changes
        run: |
          # Проверяем изменения как по .srs файлам, так и по архиву
          if [ -z "$(git status --porcelain '*.srs' 'ruleset.tar.gz')" ]; then
            echo "Файлы и архив не изменились. Выходим."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.srs' ruleset.tar.gz
          git commit -m "[auto] Update synced rules and ruleset.tar.gz $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main

      - name: Purge jsDelivr Cache
        run: |
          FILES=(
            adguard.srs
            cheburnet.srs
            filter.srs
            proxy.srs
            ruip.srs
            ru.srs
            ipdetect.srs
            private.srs
            trackers.srs
            games.srs
            ai.srs
            telegramip.srs
            ruleset.tar.gz
          )

          for file in "${FILES[@]}"; do
            curl -sfL "https://purge.jsdelivr.net/gh/jinndi/singbox_ruleset@main/$file"
          done