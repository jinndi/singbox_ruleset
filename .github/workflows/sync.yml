name: Fetch and Sync SRS Files to Main

on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * *"

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Download external files
        run: |
          FILES=(
            "adguard.srs=https://cdn.jsdelivr.net/gh/jinndi/adguard-filter-list-srs@main/adguard-filter-list.srs"
            "cheburnet.srs=https://cdn.jsdelivr.net/gh/jinndi/geosite-cheburnet@main/geosite-cheburnet.srs"
            "filter.srs=https://cdn.jsdelivr.net/gh/jinndi/fakeip-filter-srs@main/fakeip-filter.srs"
            "proxy.srs=https://cdn.jsdelivr.net/gh/jinndi/geosite-blocked@main/geosite-blocked.srs"
            "ruip.srs=https://cdn.jsdelivr.net/gh/jinndi/geoip-ru@main/ru-no-blocked.srs"
            "ru.srs=https://cdn.jsdelivr.net/gh/KaringX/karing-ruleset@sing/geo/geosite/category-ru.srs"
            "ipdetect.srs=https://cdn.jsdelivr.net/gh/KaringX/karing-ruleset@sing/geo/geosite/category-ip-geo-detect.srs"
            "private.srs=https://cdn.jsdelivr.net/gh/KaringX/karing-ruleset@sing/geo/geosite/private.srs"
            "trackers.srs=https://cdn.jsdelivr.net/gh/KaringX/karing-ruleset@sing/geo/geosite/category-public-tracker.srs"
            "games.srs=https://cdn.jsdelivr.net/gh/KaringX/karing-ruleset@sing/geo/geosite/category-games.srs"
            "ai.srs=https://cdn.jsdelivr.net/gh/KaringX/karing-ruleset@sing/geo/geosite/category-ai-chat-!cn.srs"
            "telegramip.srs=https://cdn.jsdelivr.net/gh/KaringX/karing-ruleset@sing/geo/geoip/telegram.srs"
          )

          for file in "${FILES[@]}"; do
            curl -Lo "${file%%=*}" "${file#*=}"
          done

      - name: Commit and Push changes
        run: |
          if [ -z "$(git status --porcelain '*.srs')" ]; then
            echo "Файлы не изменились. Выходим."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.srs'
          git commit -m "[auto] Update synced rules $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main

      - name: Purge jsDelivr Cache
        run: |
          FILES=(
            adguard.srs
            cheburnet.srs
            filter.srs
            proxy.srs
            ruip.srs
            ru.srs
            ipdetect.srs
            private.srs
            trackers.srs
            games.srs
            ai.srs
            telegramip.srs
          )

          for file in "${FILES[@]}"; do
            curl -sfL "https://purge.jsdelivr.net/gh/jinndi/singbox_ruleset@main/$file"
          done